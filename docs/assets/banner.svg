<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Simple Skills</title>
  <desc id="desc">Animated banner for the Simple Skills agent kit</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f7f8">
        <animate attributeName="stop-color" values="#f7f7f8;#eef8f4;#f7f7f8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7f6f1">
        <animate attributeName="stop-color" values="#e7f6f1;#d8f3ea;#e7f6f1" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b890"/>
      <stop offset="100%" stop-color="#0d8c6d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfbfc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0d0d0d" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>

  <!-- drifting orbs -->
  <circle cx="1080" cy="90" r="110" fill="#10a37f" opacity="0.14">
    <animate attributeName="cy" values="90;120;90" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1180" cy="280" r="70" fill="#2563eb" opacity="0.08">
    <animate attributeName="cx" values="1180;1140;1180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="340" r="80" fill="#10a37f" opacity="0.08">
    <animate attributeName="r" values="70;88;70" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- left accent rail -->
  <rect x="48" y="56" width="8" height="220" rx="4" fill="url(#accent)">
    <animate attributeName="height" values="220;180;220" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- copy -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
    <text x="78" y="88" fill="#667085" font-size="15" font-weight="700" letter-spacing="0.18em">SIMPLE SKILLS</text>
    <text x="78" y="150" fill="#0d0d0d" font-size="52" font-weight="750" letter-spacing="-0.035em">Agent kit that ships.</text>
    <text x="78" y="196" fill="#667085" font-size="22" font-weight="500">
      think ? design ? plan ? execute ? review ? done
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- floating cards -->
  <g filter="url(#shadow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.6s" repeatCount="indefinite"/>
      <rect x="820" y="70" width="200" height="92" rx="18" fill="url(#card)" stroke="#e5e5e5"/>
      <rect x="820" y="70" width="6" height="92" rx="3" fill="#10a37f"/>
      <text x="848" y="108" fill="#667085" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">PATH</text>
      <text x="848" y="136" fill="#0d0d0d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="700">Quick · Lite · Full</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="4.2s" repeatCount="indefinite"/>
      <rect x="1040" y="130" width="180" height="92" rx="18" fill="url(#card)" stroke="#e5e5e5"/>
      <text x="1064" y="168" fill="#667085" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">CLI</text>
      <text x="1064" y="196" fill="#0d0d0d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="24" font-weight="700">sk install</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
      <rect x="860" y="200" width="210" height="92" rx="18" fill="url(#card)" stroke="#e5e5e5"/>
      <text x="884" y="238" fill="#667085" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">THINKING</text>
      <text x="884" y="266" fill="#0d0d0d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="700">12 methods</text>
    </g>
  </g>

  <!-- bottom pills -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700">
    <g>
      <rect x="78" y="248" width="118" height="34" rx="17" fill="#10a37f"/>
      <text x="137" y="270" text-anchor="middle" fill="#ffffff">pipx + sk</text>
    </g>
    <g>
      <rect x="208" y="248" width="108" height="34" rx="17" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="262" y="270" text-anchor="middle" fill="#0d0d0d">light HTML</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="328" y="248" width="92" height="34" rx="17" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="374" y="270" text-anchor="middle" fill="#0d0d0d">MIT</text>
    </g>
    <g>
      <rect x="432" y="248" width="140" height="34" rx="17" fill="#e7f6f1" stroke="#b7e6d6"/>
      <text x="502" y="270" text-anchor="middle" fill="#0f766e">Python ? 3.11</text>
    </g>
  </g>

  <!-- pulse -->
  <circle cx="1210" cy="56" r="9" fill="#10a37f">
    <animate attributeName="r" values="7;13;7" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- progress bar -->
  <rect x="78" y="318" width="520" height="10" rx="5" fill="#e5e5e5"/>
  <rect x="78" y="318" width="180" height="10" rx="5" fill="#10a37f">
    <animate attributeName="width" values="120;480;220;520;180" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <text x="78" y="352" fill="#667085" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600">Kit .agents/  ?  Work .agent-work/</text>
</svg>
