display_name: "API BA"
short_description: "Business API summary (api-doc) or API↔system↔screen map (api-map)."
default_prompt: "Use $api-ba with mode=api-doc|api-map (or short api-assess|api-design). Write API_BA.md; never invent endpoints."
required_input: "Mode, API docs/URL/spec, consumer screens/flows, system entities, auth constraints."
required_output: "API_BA.md with sources, summary and/or mapping, risks, open questions, handoff."
note_important: "Do NOT invent endpoints/fields. Do NOT copy secrets. Confirm-first when docs are missing."
artifacts:
  API_BA.md:
    required: true
    schema:
      executive_summary: { type: array, required: true }
      developer_overview: { type: object, required: true }
      mode: { type: string, required: true }
      sources: { type: array, required: true }
      open_questions: { type: array, required: true }
      handoff: { type: string, required: true }
