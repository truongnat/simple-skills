display_name: "Brainstorming"
short_description: "Step workflow: seed DISCUSSION template, then frame → scope/options → recommend before design/planning."
default_prompt: "Use $brainstorming: seed the template, triage issues and visual needs, stop to ask about unresolved Critical/blocking items, then scope/options/recommend."
required_input: "Initial request, repo context, existing documents, constraints, current behavior, desired outcome, stakeholder feedback if available; session path."
required_output: "Session DISCUSSION.md seeded from templates/DISCUSSION.template.md and filled via steps/. Incomplete if chat-only or steps skipped."
note_important: "Do NOT skip step-01-init. Confirm-first: STOP immediately on Critical/blocking/Spec blockers; classify Ask method (confirm/choice/fact/table/diagram/html) before asking; never continue by choosing defaults or shipping quiz-as-document. Challenge Feasibility, Correctness, and Capability gaps before recommending. Create accessible HTML with Tailwind + anime.js CDN tags only after user confirmation for html Ask method unless explicitly requested. Do NOT treat assumptions/specs as facts, hide blockers, implement code, or create PLAN/TASKS."
workflow:
  - "Seed DISCUSSION.md from the template."
  - "Frame facts/assumptions; classify material issues by severity and blocking status."
  - "Challenge specs with Feasibility, Correctness, and Capability recommendations; promote blocking gaps to clarification."
  - "STOP and ask at most three focused blocking questions when Critical/blocking/Spec-quality items remain; record answers before continuing."
  - "Choose text/table/diagram/HTML by decision value; HTML only for spatial/state comparison and with user confirmation."
  - "Fill scope/options, recommendation/handoff."
artifacts:
  DISCUSSION.md:
    required: true
    schema:
      source_template:
        type: string
        required: true
        description: "Must be seeded from templates/DISCUSSION.template.md via step-01."
      step_ledger:
        type: table
        required: true
        description: "Steps 02–04 status; no later step done while earlier is todo."
      executive_summary:
        type: array
        required: true
        description: "Maximum five bullets with direction, key facts, recommendation, risk, and next action."
      charts:
        type: array
        required: false
        description: "Mermaid charts for options/flows/risks when useful; omit if not needed."
      goal_and_outcome:
        type: object
        required: true
        description: "Goal (one sentence) + Outcome (observable behaviors when done)."
      context:
        type: object
        required: true
        description: "Facts + Constraints + Assumptions (omit Unknowns if none)."
      issues_and_decisions:
        type: object
        required: true
        description: "Issue triage + Spec quality review (Feasibility/Correctness/Capability)."
      scope:
        type: object
        required: true
        description: "Scope in + Scope out + Non-goals."
      options_and_recommendation:
        type: object
        required: true
        description: "Options matrix + Recommendation (Choose/Reason/Not choosing/Confidence)."
      risks:
        type: array
        required: false
        description: "Risks with impact and mitigation."
      handoff:
        type: string
        required: true
        description: "Next skill: business-analysis, basic-design, planning, research, or execution."
  VISUAL_DECISION.html:
    required: false
    description: "User-confirmed accessible decision aid for html-recommended issues; must include Tailwind + anime.js CDN tags for static viewing; serve via session-serve to record choices; no sensitive data."
